name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # 本项目在 Windows 上开发；测试里有大量路径/编码/换行相关断言。
    # 先只在 Windows 上跑：其它平台的绿灯是「没测过」，不是「通过」。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run check:artifacts
